<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Philadelphia Zonal HQ — Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CONFIG — edit these for a different church. See build spec Section 6.
   ========================================================================== */
</style>
<script>
  var CONFIG = {
    // Filled in after you create the two Apps Script deployments (Section 3.5
    // of the build spec). SCRIPT_URL = "Anyone" deployment. ADMIN_URL =
    // "Anyone with a Google account" deployment.
    SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwNp5nRdNLo0AHj1TNApmRjuNtBKI1zYMK_cs6Z2Eni-vEFJOnXqAW4vO4IkgD9bcqI/exec',
    ADMIN_URL: 'https://script.google.com/macros/s/AKfycbzkCDrgndVbh8R4s58paLDsAwiBGAdv8dirobMIu5HakA_Ofu7bdKXPn7_leUQ_Yop5/exec',

    CHURCH_NAME: 'Philadelphia Zonal HQ',
    SUBTITLE: 'Every seed you plant here counts. Glad you\'re here.',
    TAGLINE: 'Happy people, Covenant children',

    WELFARE_EMAIL: 'rccgphiladelphia24@gmail.com',
    WELFARE_PHONE: '', // "unavailable for now" — left blank so the tel: link hides gracefully

    // No social links were supplied yet. Add entries like:
    // { label: 'Instagram', url: 'https://instagram.com/yourchurch' }
    // and they will appear automatically; the whole section hides if empty.
    SOCIALS: [],

    VERSES: [
      { text: 'Train up a child in the way he should go: and when he is old, he will not depart from it.', ref: 'Proverbs 22:6' },
      { text: 'Let no man despise thy youth; but be thou an example of the believers.', ref: '1 Timothy 4:12' },
      { text: 'I can do all things through Christ which strengtheneth me.', ref: 'Philippians 4:13' },
      { text: 'Trust in the LORD with all thine heart; and lean not unto thine own understanding.', ref: 'Proverbs 3:5' },
      { text: 'Showing up is a small act of faith. Small acts, done consistently, become a life.', ref: '' },
      { text: 'Be strong and of a good courage; be not afraid, neither be thou dismayed.', ref: 'Joshua 1:9' },
      { text: 'A covenant kept in small things is a covenant that can be trusted with big things.', ref: '' },
      { text: 'For I know the thoughts that I think toward you, saith the LORD, thoughts of peace.', ref: 'Jeremiah 29:11' },
      { text: 'Consistency is just love, repeated.', ref: '' },
      { text: 'And let us not be weary in well doing: for in due season we shall reap, if we faint not.', ref: 'Galatians 6:9' }
    ]
  };
</script>
<style>
  :root{
    --paper:#faf6ee;
    --paper-deep:#f1ead9;
    --ink:#1f2b23;
    --ink-soft:#5c6b60;
    --ink-deep:#0f1a12;
    --brand:#047a2d;
    --brand-deep:#035a21;
    --brand-tint:#e6f2e9;
    --gold:#d9a441;
    --gold-deep:#b9822a;
    --line:#e5decb;
    --radius:18px;
    --shadow: 0 6px 20px rgba(31,43,35,0.08), 0 1px 3px rgba(31,43,35,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #fffdf7 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px;}

  /* ---------- header ---------- */
  header{text-align:center;padding:14px 0 24px;position:relative;}
  .mark{
    width:46px;height:46px;margin:0 auto 12px;
    display:flex;align-items:center;justify-content:center;
    border-radius:14px;background:var(--brand);
    box-shadow:var(--shadow);
  }
  .mark svg{width:24px;height:24px;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(28px,7vw,36px);
    margin:0;color:var(--ink-deep);
    letter-spacing:-0.01em;
    cursor:default;
    user-select:none;
  }
  .subtitle{color:var(--ink-soft);font-size:14.5px;margin-top:8px;line-height:1.5;}

  /* ---------- shared card ---------- */
  .card{
    background:#fffdf9;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:18px;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-size:19px;font-weight:600;margin:0 0 14px;color:var(--ink-deep);
  }
  .eyebrow{
    font-size:11.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--brand-deep);margin-bottom:6px;display:block;
  }

  /* ---------- check-in ---------- */
  .field{margin-bottom:14px;position:relative;}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  input[type=text]{
    width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);
    font-size:16px;font-family:inherit;background:#fff;color:var(--ink);
    transition:border-color .15s;
  }
  input[type=text]:focus{outline:none;border-color:var(--brand);}
  .typeahead{
    position:absolute;left:0;right:0;top:100%;margin-top:6px;
    background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);max-height:220px;overflow-y:auto;z-index:20;
  }
  .typeahead div{padding:11px 14px;font-size:15px;cursor:pointer;}
  .typeahead div:hover, .typeahead div.active{background:var(--brand-tint);}
  .selected-chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--brand-tint);
    color:var(--brand-deep);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14.5px;
  }
  .selected-chip button{
    background:none;border:none;color:var(--brand-deep);cursor:pointer;font-size:15px;line-height:1;padding:0;
  }
  .btn{
    width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:600;
    font-family:inherit;cursor:pointer;transition:transform .1s, box-shadow .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(4,122,45,0.25);}
  .btn-primary:disabled{background:#c8cfc9;box-shadow:none;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
  .hint{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}

  .result{border-radius:14px;padding:18px;text-align:center;}
  .result.success{background:var(--brand-tint);}
  .result.info{background:#fdf3e4;}
  .result-title{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--ink-deep);margin-bottom:6px;}
  .result-sub{font-size:14px;color:var(--ink-soft);}
  .streak{
    margin-top:12px;display:inline-flex;align-items:center;gap:6px;
    background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--gold-deep);
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  .leaf-anim{width:52px;height:52px;margin:0 auto 10px;}

  /* ---------- next up + quote ---------- */
  .pair{display:grid;grid-template-columns:1fr;gap:14px;}
  .quote-text{font-family:'Fraunces',serif;font-style:italic;font-size:16px;line-height:1.55;color:var(--ink-deep);}
  .quote-ref{font-size:12.5px;color:var(--ink-soft);margin-top:8px;font-weight:600;}
  .next-up-row{display:flex;gap:12px;align-items:flex-start;}
  .next-up-badge{
    flex:0 0 auto;width:48px;height:48px;border-radius:12px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;
    font-size:13px;line-height:1.15;text-align:center;font-family:'Fraunces',serif;
  }
  .next-up-name{font-weight:700;font-size:15.5px;color:var(--ink-deep);}
  .next-up-when{font-size:13.5px;color:var(--ink-soft);margin-top:2px;}
  .next-up-theme{font-size:13px;color:var(--brand-deep);margin-top:4px;font-weight:600;}

  /* ---------- announcements ---------- */
  .ann-card{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:#fff;}
  .ann-card img{width:100%;display:block;max-height:170px;object-fit:cover;}
  .ann-body{padding:16px;}
  .ann-title{
    font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--ink-deep);
    cursor:pointer;text-decoration:none;
  }
  .ann-title:hover{color:var(--brand-deep);}
  .ann-meta{font-size:13.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .ann-tag{
    display:inline-block;background:var(--brand-tint);color:var(--brand-deep);font-size:11.5px;
    font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:3px 9px;border-radius:6px;margin-top:8px;
  }

  /* ---------- footer ---------- */
  footer{text-align:center;padding-top:8px;}
  .socials{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .socials a{
    font-size:13px;font-weight:600;color:var(--brand-deep);text-decoration:none;
    border:1.5px solid var(--line);padding:8px 14px;border-radius:999px;background:#fff;
  }
  .contact-line{font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .contact-line a{color:var(--brand-deep);text-decoration:none;font-weight:600;}
  .tagline{font-size:12.5px;color:var(--ink-soft);margin-top:14px;font-style:italic;}

  .burst{position:fixed;pointer-events:none;font-size:24px;z-index:999;animation:floatUp 1.1s ease-out forwards;}
  @keyframes floatUp{
    0%{transform:translateY(0) scale(0.6);opacity:0;}
    15%{opacity:1;transform:translateY(-10px) scale(1);}
    100%{transform:translateY(-140px) scale(1.1);opacity:0;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21C12 21 5 15.8 5 10.2C5 6.8 7.7 4.5 10.5 5.3C11.2 5.5 11.7 6 12 6.6C12.3 6 12.8 5.5 13.5 5.3C16.3 4.5 19 6.8 19 10.2C19 15.8 12 21 12 21Z" fill="white"/></svg>
    </div>
    <h1 id="churchTitle">Philadelphia Zonal HQ</h1>
    <div class="subtitle" id="churchSubtitle"></div>
  </header>

  <!-- CHECK-IN -->
  <div class="card" id="checkinCard">
    <h2>Check yourself in</h2>
    <div id="checkinForm">
      <div class="field">
        <label for="nameSearch">Find your name</label>
        <input type="text" id="nameSearch" placeholder="Start typing your name…" autocomplete="off">
        <div class="typeahead" id="typeahead" style="display:none;"></div>
      </div>

      <div id="selectedNameArea" style="display:none;margin-bottom:14px;">
        <span class="selected-chip" id="selectedChip"></span>
      </div>

      <div class="field" id="confirmField" style="display:none;">
        <label for="confirmName">Type your full name again to confirm it's you</label>
        <input type="text" id="confirmName" placeholder="Re-type your full name">
      </div>

      <div class="field" id="loggedByField" style="display:none;">
        <label for="loggedBy">Logged by (only if someone else is entering this for you)</label>
        <input type="text" id="loggedBy" placeholder="Optional">
      </div>

      <button class="btn btn-primary" id="submitBtn" disabled>Save my attendance</button>
      <div class="hint">No date to pick — today's date is stamped automatically when you save.</div>
    </div>

    <div id="checkinResult" style="display:none;"></div>
  </div>

  <!-- QUOTE + NEXT UP -->
  <div class="pair">
    <div class="card" id="quoteCard">
      <span class="eyebrow">Word for today</span>
      <div class="quote-text" id="quoteText">Loading…</div>
      <div class="quote-ref" id="quoteRef"></div>
    </div>

    <div class="card" id="nextUpCard" style="display:none;">
      <span class="eyebrow">Next up</span>
      <div class="next-up-row">
        <div class="next-up-badge" id="nextUpBadge">–</div>
        <div>
          <div class="next-up-name" id="nextUpName"></div>
          <div class="next-up-when" id="nextUpWhen"></div>
          <div class="next-up-theme" id="nextUpTheme"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ANNOUNCEMENTS -->
  <div id="announcementsWrap"></div>

  <!-- FOOTER -->
  <footer>
    <div class="socials" id="socialsRow"></div>
    <div id="contactLines"></div>
    <div class="tagline">Philadelphia Zonal HQ — Happy people, Covenant children</div>
  </footer>

</div>

<script>
(function(){

  document.getElementById('churchTitle').textContent = CONFIG.CHURCH_NAME;
  document.getElementById('churchSubtitle').textContent = CONFIG.SUBTITLE;
  document.querySelector('.tagline').textContent = CONFIG.CHURCH_NAME + ' — ' + CONFIG.TAGLINE;
  document.title = CONFIG.CHURCH_NAME + ' — Attendance';

  var roster = [];
  var announcements = [];
  var selected = null; // {first,last}

  // ---------------- init ----------------
  fetch(CONFIG.SCRIPT_URL + '?action=init')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data.success) return;
      roster = data.roster || [];
      announcements = data.announcements || [];
      renderQuote();
      renderAnnouncements();
      renderNextUp();
    })
    .catch(function(){
      document.getElementById('quoteText').textContent = 'Could not load — please refresh.';
    });

  // ---------------- typeahead ----------------
  var searchInput = document.getElementById('nameSearch');
  var typeahead = document.getElementById('typeahead');

  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim().toLowerCase();
    typeahead.innerHTML = '';
    if(!q){ typeahead.style.display='none'; return; }
    var matches = roster.filter(function(p){
      var full = (p.first + ' ' + p.last).toLowerCase();
      return full.indexOf(q) !== -1;
    }).slice(0, 8);
    if(!matches.length){ typeahead.style.display='none'; return; }
    matches.forEach(function(p){
      var div = document.createElement('div');
      div.textContent = p.first + ' ' + p.last;
      div.onclick = function(){ selectPerson(p); };
      typeahead.appendChild(div);
    });
    typeahead.style.display='block';
  });

  document.addEventListener('click', function(e){
    if(!typeahead.contains(e.target) && e.target !== searchInput){
      typeahead.style.display = 'none';
    }
  });

  function selectPerson(p){
    selected = p;
    typeahead.style.display = 'none';
    searchInput.value = '';
    searchInput.parentElement.style.display = 'none';

    var chipArea = document.getElementById('selectedNameArea');
    var chip = document.getElementById('selectedChip');
    chip.innerHTML = p.first + ' ' + p.last + ' <button id="clearSelected">✕</button>';
    chipArea.style.display = 'block';
    document.getElementById('clearSelected').onclick = resetSelection;

    document.getElementById('confirmField').style.display = 'block';
    document.getElementById('loggedByField').style.display = 'block';
    document.getElementById('confirmName').value = '';
    checkSubmitEnabled();
  }

  function resetSelection(){
    selected = null;
    searchInput.parentElement.style.display = 'block';
    document.getElementById('selectedNameArea').style.display = 'none';
    document.getElementById('confirmField').style.display = 'none';
    document.getElementById('loggedByField').style.display = 'none';
    document.getElementById('submitBtn').disabled = true;
  }

  document.getElementById('confirmName').addEventListener('input', checkSubmitEnabled);

  function checkSubmitEnabled(){
    var btn = document.getElementById('submitBtn');
    if(!selected){ btn.disabled = true; return; }
    var typed = document.getElementById('confirmName').value.trim().toLowerCase();
    var full = (selected.first + ' ' + selected.last).trim().toLowerCase();
    btn.disabled = (typed !== full);
  }

  document.getElementById('submitBtn').addEventListener('click', function(){
    if(!selected) return;
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Saving…';

    var payload = {
      action: 'checkin',
      firstName: selected.first,
      lastName: selected.last,
      loggedBy: document.getElementById('loggedBy').value.trim()
    };

    // Plain-text body, no custom Content-Type header — Apps Script's web
    // app endpoint mishandles the CORS preflight a JSON content-type
    // header would trigger.
    fetch(CONFIG.SCRIPT_URL, { method:'POST', body: JSON.stringify(payload) })
      .then(function(r){ return r.json(); })
      .then(function(res){ showResult(res); })
      .catch(function(){
        btn.disabled = false;
        btn.textContent = 'Save my attendance';
        alert('Something went wrong. Please check your connection and try again.');
      });
  });

  function showResult(res){
    document.getElementById('checkinForm').style.display = 'none';
    var box = document.getElementById('checkinResult');
    box.style.display = 'block';

    if(!res.success){
      box.className = 'result info';
      box.innerHTML = '<div class="result-title">Hmm</div><div class="result-sub">' + escapeHtml(res.message) + '</div>';
      return;
    }

    var leafSvg = '<svg class="leaf-anim" viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="25" fill="#e6f2e9"/><path d="M26 38C26 38 15 31 15 21.5C15 16.5 19 12.8 23 13.9C24.1 14.2 25 14.9 26 16C27 14.9 27.9 14.2 29 13.9C33 12.8 37 16.5 37 21.5C37 31 26 38 26 38Z" fill="#047a2d"/></svg>';

    var streakHtml = '';
    if(res.streak && res.streak >= 2){
      streakHtml = '<div class="streak">🔥 ' + res.streak + ' in a row!</div>';
    }

    box.className = 'result ' + (res.alreadyCheckedIn ? 'info' : 'success');
    box.innerHTML =
      leafSvg +
      '<div class="result-title">' + (res.alreadyCheckedIn ? 'Already here today' : 'Attendance saved successfully!') + '</div>' +
      '<div class="result-sub">' + escapeHtml(res.message) + '</div>' +
      streakHtml +
      '<div style="margin-top:16px;"><button class="btn btn-ghost" id="checkinAgainBtn">Check in someone else</button></div>';

    document.getElementById('checkinAgainBtn').onclick = function(){
      resetSelection();
      document.getElementById('checkinForm').style.display = 'block';
      box.style.display = 'none';
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Save my attendance';
    };
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  // ---------------- quote of the day ----------------
  function dayOfYear(d){
    var start = new Date(d.getFullYear(), 0, 0);
    var diff = d - start;
    return Math.floor(diff / 86400000);
  }

  function renderQuote(){
    var list = CONFIG.VERSES;
    var idx = dayOfYear(new Date()) % list.length;
    var v = list[idx];
    document.getElementById('quoteText').textContent = '"' + v.text + '"';
    document.getElementById('quoteRef').textContent = v.ref;
  }

  // ---------------- next up ----------------
  function withTime(date, hour, minute){
    var d = new Date(date);
    d.setHours(hour, minute || 0, 0, 0);
    return d;
  }

  function nextWeekday(from, targetDow, hour, minute){
    var d = new Date(from);
    d.setHours(0,0,0,0);
    var diff = (targetDow - d.getDay() + 7) % 7;
    var candidate = withTime(new Date(d.getTime() + diff*86400000), hour, minute);
    if(candidate <= from){
      candidate = withTime(new Date(d.getTime() + (diff+7)*86400000), hour, minute);
    }
    return candidate;
  }

  function nextFirstOfMonth(from, hour, minute){
    var d = new Date(from.getFullYear(), from.getMonth(), 1);
    var candidate = withTime(d, hour, minute);
    if(candidate <= from){
      candidate = withTime(new Date(from.getFullYear(), from.getMonth()+1, 1), hour, minute);
    }
    return candidate;
  }

  // Per-event day/time rules — update these if the schedule changes for
  // this church (see build spec Section 6, "Recurring event names & schedule").
  var EVENT_RULES = {
    church_service: function(now){ return nextWeekday(now, 0, 8, 0); },   // Sunday 8am
    higher_ground:  function(now){ return nextFirstOfMonth(now, 6, 0); }, // 1st of month, 6am
    digging_deep:   function(now){ return nextWeekday(now, 2, 18, 0); }, // Tuesday 6pm
    faith_clinic:   function(now){ return nextWeekday(now, 4, 18, 0); }, // Thursday 6pm
    fellowship:     function(now){ return nextWeekday(now, 0, 18, 0); }  // Sunday 6pm
  };

  function nextDateForAnnouncement(a, now){
    if(a.specialDate){
      var special = new Date(a.specialDate + 'T00:00:00');
      if(special >= now) return special;
      return null;
    }
    var rule = EVENT_RULES[a.key];
    return rule ? rule(now) : null;
  }

  function renderNextUp(){
    var now = new Date();
    var best = null;
    announcements.forEach(function(a){
      var d = nextDateForAnnouncement(a, now);
      if(d && (!best || d < best.date)){
        best = { date: d, ann: a };
      }
    });
    if(!best) return;

    var card = document.getElementById('nextUpCard');
    card.style.display = 'block';
    var dayLabel = best.date.toLocaleDateString(undefined, { weekday:'short' }).toUpperCase();
    var dateNum = best.date.getDate();
    document.getElementById('nextUpBadge').innerHTML = dayLabel + '<br>' + dateNum;
    document.getElementById('nextUpName').textContent = best.ann.title;
    document.getElementById('nextUpWhen').textContent = best.date.toLocaleString(undefined, { weekday:'long', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    document.getElementById('nextUpTheme').textContent = best.ann.theme || '';
  }

  // ---------------- announcements ----------------
  function renderAnnouncements(){
    var wrap = document.getElementById('announcementsWrap');
    wrap.innerHTML = '';
    if(!announcements.length) return;

    var header = document.createElement('div');
    header.innerHTML = '<span class="eyebrow" style="margin:6px 2px 10px;display:block;">What\'s happening</span>';
    wrap.appendChild(header);

    announcements.forEach(function(a){
      var card = document.createElement('div');
      card.className = 'ann-card';
      var img = a.imageUrl ? '<img src="'+a.imageUrl+'" alt="'+escapeHtml(a.title)+'">' : '';
      var dress = a.dressTheme ? '<span class="ann-tag">'+escapeHtml(a.dressTheme)+'</span>' : '';
      card.innerHTML =
        img +
        '<div class="ann-body">' +
          '<a class="ann-title" data-key="'+a.key+'">'+escapeHtml(a.title)+' ↓</a>' +
          '<div class="ann-meta">'+escapeHtml(a.schedule)+(a.theme ? ' · '+escapeHtml(a.theme) : '')+'</div>' +
          dress +
        '</div>';
      wrap.appendChild(card);
    });

    wrap.querySelectorAll('.ann-title').forEach(function(el){
      el.addEventListener('click', function(){
        var key = el.getAttribute('data-key');
        var ann = announcements.filter(function(a){ return a.key === key; })[0];
        if(ann) downloadIcs(ann);
      });
    });
  }

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function icsDate(d){
    return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
  }

  function downloadIcs(ann){
    var start = nextDateForAnnouncement(ann, new Date());
    if(!start){ alert('No upcoming date found for this event yet.'); return; }
    var end = new Date(start.getTime() + 60*60000);

    var ics = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//'+CONFIG.CHURCH_NAME+'//Attendance//EN',
      'BEGIN:VEVENT',
      'UID:'+ann.key+'-'+start.getTime()+'@attendance',
      'DTSTAMP:'+icsDate(new Date()),
      'DTSTART:'+icsDate(start),
      'DTEND:'+icsDate(end),
      'SUMMARY:'+ann.title,
      'DESCRIPTION:'+(ann.theme || '').replace(/\n/g,'\\n'),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Reminder','TRIGGER:-P1D','END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Reminder','TRIGGER:-PT1H','END:VALARM',
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');

    var blob = new Blob([ics], { type:'text/calendar' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = ann.title.replace(/[^a-z0-9]/gi,'_') + '.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------------- footer: socials + contact ----------------
  function renderFooter(){
    var row = document.getElementById('socialsRow');
    if(CONFIG.SOCIALS && CONFIG.SOCIALS.length){
      CONFIG.SOCIALS.forEach(function(s){
        var a = document.createElement('a');
        a.href = s.url; a.textContent = s.label; a.target = '_blank'; a.rel = 'noopener';
        row.appendChild(a);
      });
    } else {
      row.style.display = 'none';
    }

    var lines = document.getElementById('contactLines');
    var html = '';
    if(CONFIG.WELFARE_EMAIL){
      html += '<div class="contact-line">Need to talk to someone? <a href="mailto:'+CONFIG.WELFARE_EMAIL+'">'+CONFIG.WELFARE_EMAIL+'</a></div>';
    }
    if(CONFIG.WELFARE_PHONE){
      html += '<div class="contact-line"><a href="tel:'+CONFIG.WELFARE_PHONE+'">'+CONFIG.WELFARE_PHONE+'</a></div>';
    }
    lines.innerHTML = html;
  }
  renderFooter();

  // ---------------- easter egg: tap title 5x fast ----------------
  var tapTimes = [];
  document.getElementById('churchTitle').addEventListener('click', function(e){
    var now = Date.now();
    tapTimes.push(now);
    tapTimes = tapTimes.filter(function(t){ return now - t < 1500; });
    if(tapTimes.length >= 5){
      tapTimes = [];
      burstEmoji(e.clientX, e.clientY);
    }
  });

  function burstEmoji(x, y){
    var emojis = ['🌱','💚','🔥','✨','🙌'];
    for(var i=0;i<8;i++){
      var span = document.createElement('span');
      span.className = 'burst';
      span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      span.style.left = (x + (Math.random()*80-40)) + 'px';
      span.style.top = (y + (Math.random()*20-10)) + 'px';
      document.body.appendChild(span);
      (function(el){ setTimeout(function(){ el.remove(); }, 1200); })(span);
    }
  }

})();
</script>
</body>
